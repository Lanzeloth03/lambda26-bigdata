site_name: EcoData Aire — Juliaca (Big Data, Proyecto Sello)
site_description: Sistema Big Data Lambda de calidad del aire (PM2.5) en Juliaca — Unidades 1, 2 y 3
site_author: Lanzeloth Vargas Marichi
site_url: https://lanzeloth03.github.io/lambda26-bigdata/
repo_url: https://github.com/Lanzeloth03/lambda26-bigdata
repo_name: Lanzeloth03/lambda26-bigdata

theme:
  name: material
  language: es
  palette:
    primary: indigo
    accent: amber
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy

nav:
  - Inicio: index.md
  - Guía de Proyecto Sello:
      - Brief técnico-analítico: brief.md
      - Matriz de trazabilidad: trazabilidad.md
      - Arquitectura: arquitectura.md
      - Datos: datos.md
      - Módulos y funcionalidades: modulos.md
      - Instalación y ejecución: ejecucion.md
      - Uso del sistema: uso.md
      - Pruebas y evidencias: pruebas.md
      - Observabilidad y costos: observabilidad-costos.md
      - Decisiones técnicas: decisiones.md
      - Equipo y aporte individual: equipo.md
      - Repositorio y estándares: repositorio.md
      - Limitaciones y mejoras: limitaciones.md
      - Informe del proyecto: informe.md
  - 1. Arquitecturas Big Data y ETL batch distribuido:
      - Producto U1: u1-producto.md
      - S1 - Arquitectura Big Data: sesiones/S01.md
      - S2 - Fundamentos PySpark: sesiones/S02.md
      - S3 - Procesamiento y calidad de datos: sesiones/S03.md
      - S4 - ML distribuido con MLlib: sesiones/S04.md
      - S5 - Evaluación de la Unidad I: sesiones/S05.md
  - 2. Sistema Big Data en tiempo real:
      - Producto U2: u2-producto.md
      - S6 - Ingesta de eventos empresariales: sesiones/S06.md
      - S7 - Ingesta de eventos IoT/sensores: sesiones/S07.md
      - S8 - Streaming con Spark: sesiones/S08.md
      - S9 - Observabilidad con Grafana y costos: sesiones/S09.md
      - S10 - Series de tiempo e inferencia: sesiones/S10.md
      - S11 - BI/ML distribuido con Spark: sesiones/S11.md
      - S12 - Evaluación de la Unidad II: sesiones/S12.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
