site_name: EcoData - Unidad 1 y 2
site_description: Sistema de Alerta Temprana de Calidad del Aire - Juliaca
site_author: Lanzeloth Vargas Marichi
site_url: https://lanzeloth03.github.io/lambda26-bigdata/
repo_url: https://github.com/Lanzeloth03/lambda26-bigdata
repo_name: Lanzeloth03/lambda26-bigdata

theme:
  name: material
  palette:
    primary: indigo
    accent: light blue
  features:
    - navigation.top
    - content.code.copy

nav:
  - Inicio: index.md
  - Brief técnico-analítico: brief.md
  - Producto Unidad 1:
      - Producto U1: u1-producto.md
      - Arquitectura: arquitectura.md
      - Dimensión Aire (Lanzeloth): dimension-lanzeloth.md
      - Dimensión Aire ampliada (Lanzeloth): dimension-lanzeloth-ampliada.md
      - Resultados: resultados.md
  - Producto Unidad 2:
      - Producto U2 (resumen): u2/index.md
      - Dimensión Aire (Lanzeloth): u2/dimension-aire.md
      - Operación, escalado y costos: u2/operacion.md
      - Contrato de eventos: u2/contrato-eventos.md
      - Observabilidad y alertas: u2/observabilidad-alertas.md
      - Preparación S12: u2/s12-preparacion.md
      - Evidencias: u2/evidencias.md
      - Limitaciones y mejoras: u2/limitaciones.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
