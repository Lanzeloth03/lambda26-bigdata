name: lambda26-obs

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: lambda26-prometheus
    restart: unless-stopped
    ports:
      - "49090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - lambda26_prometheus_data:/prometheus
    networks:
      - lambda26-kafka-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lambda26-grafana
    restart: unless-stopped
    ports:
      - "43000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - lambda26_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - lambda26-kafka-net

volumes:
  lambda26_prometheus_data:
  lambda26_grafana_data:

networks:
  lambda26-kafka-net:
    external: true
    name: lambda26-kafka-net
